<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The River — Project Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #c8cdd4;
  font-family: Georgia, serif;
  overflow: hidden;
  height: 100vh; width: 100vw;
}
#explorer { position: relative; width: 100vw; height: 100vh; }
#river-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ── River flow animation ─────────────────── */
@keyframes rf { to { stroke-dashoffset: -500; } }
.rf-a { animation: rf  5s linear infinite; }
.rf-b { animation: rf  8s linear infinite; }
.rf-c { animation: rf 13s linear infinite; }
.rf-d { animation: rf 20s linear infinite; }

/* ── Stone card faces ─────────────────────── */
.card-fo-wrap {
  display: flex; align-items: center; justify-content: center;
}
.card-wrap {
  width: 70px; height: 94px;
  perspective: 700px;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.54s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer;
}
.card-wrap:hover .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.card-front { transform: rotateY(180deg); }
.card-back  svg,
.card-front svg { width: 100%; height: 100%; display: block; }

/* Ten distinct stone silhouettes — scaled to 70×94 */
.card-face[data-stone="1"]  { clip-path: path('M 35,5 C 51,0 69,10 74,29 C 79,49 75,75 62,88 C 49,100 28,99 15,86 C 2,73 -1,50 5,31 C 11,11 19,10 35,5 Z'); }
.card-face[data-stone="2"]  { clip-path: path('M 37,8 C 55,2 74,16 76,37 C 77,58 66,83 46,91 C 27,99 4,91 -2,68 C -7,45 3,23 18,11 C 33,0 19,15 37,8 Z'); }
.card-face[data-stone="3"]  { clip-path: path('M 35,3 C 50,-2 64,8 69,28 C 74,47 72,73 63,87 C 53,102 35,102 22,91 C 9,79 3,58 5,37 C 7,16 20,8 35,3 Z'); }
.card-face[data-stone="4"]  { clip-path: path('M 33,6 C 50,-1 75,11 79,32 C 83,53 73,83 53,92 C 33,100 10,94 2,73 C -5,52 2,29 13,15 C 24,-1 15,14 33,6 Z'); }
.card-face[data-stone="5"]  { clip-path: path('M 36,10 C 54,3 73,18 75,41 C 77,63 64,86 45,92 C 25,99 2,89 -2,66 C -7,44 4,23 19,13 C 33,3 18,16 36,10 Z'); }
.card-face[data-stone="6"]  { clip-path: path('M 34,5 C 51,-2 74,10 78,32 C 82,55 72,81 51,91 C 31,100 7,94 1,73 C -6,52 1,29 12,15 C 24,-1 17,12 34,5 Z'); }
.card-face[data-stone="7"]  { clip-path: path('M 36,4 C 50,1 65,11 70,31 C 75,50 72,76 59,89 C 46,102 27,100 14,87 C 1,75 -2,50 4,31 C 10,11 21,7 36,4 Z'); }
.card-face[data-stone="8"]  { clip-path: path('M 36,8 C 55,2 76,18 77,41 C 79,63 67,86 46,92 C 24,99 0,89 -4,66 C -8,44 2,21 18,11 C 33,-1 16,14 36,8 Z'); }
.card-face[data-stone="9"]  { clip-path: path('M 36,6 C 50,2 68,15 72,36 C 75,57 68,79 50,89 C 33,99 11,94 5,73 C -2,52 3,31 15,16 C 26,2 21,11 36,6 Z'); }
.card-face[data-stone="10"] { clip-path: path('M 39,5 C 57,0 77,15 79,37 C 81,60 69,84 49,92 C 28,100 5,92 0,70 C -5,47 4,24 16,13 C 28,-1 21,10 39,5 Z'); }

.card-wrap:hover .card-inner { filter: drop-shadow(0 3px 10px rgba(10,20,40,0.26)); }
.card-wrap:hover .card-inner:hover {
  filter: drop-shadow(0 0 10px rgba(255,206,44,0.92))
          drop-shadow(0 0 28px rgba(255,172,22,0.58));
}

/* ── Modal ───────────────────────────────── */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(185,196,210,0.65);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.32s ease;
}
#modal-overlay.open { opacity: 1; pointer-events: auto; }
#modal-card {
  background: rgba(246,244,240,0.96);
  border: 1px solid rgba(168,162,146,0.50);
  border-radius: 6px;
  box-shadow: 0 22px 64px rgba(10,18,30,0.24);
  width: min(500px,88vw); max-height: 88vh;
  overflow-y: auto; padding: 42px 40px 46px;
  position: relative;
  transform: scale(0.86);
  transition: transform 0.38s cubic-bezier(0.34,1.4,0.64,1);
}
#modal-overlay.open #modal-card { transform: scale(1); }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none; font-size: 18px;
  cursor: pointer; color: #9ea8b2;
  padding: 6px 10px; border-radius: 50%;
  transition: color 0.2s, background 0.2s; line-height: 1;
}
.modal-close:hover { color: #222; background: #e4e0d8; }
#modal-cover-wrap {
  width: 100%; border-radius: 4px; overflow: hidden;
  margin-bottom: 26px; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  aspect-ratio: 3/4;
}
#modal-cover-wrap svg { width: 100%; height: 100%; display: block; }
#modal-title { font-size: 24px; font-weight: normal; color: #181818; margin-bottom: 9px; line-height: 1.3; margin-top: 0; }
#modal-tag   { display: inline-block; margin-bottom: 20px; }
.modal-tag {
  display: inline-block; font-size: 10px; letter-spacing: 1.8px;
  text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
  margin-bottom: 18px; font-family: 'Helvetica Neue', Arial, sans-serif;
}
#modal-desc { font-size: 14px; line-height: 1.9; color: #444; margin-bottom: 14px; }
#modal-body { font-size: 13px; line-height: 1.95; color: #888; font-style: italic; margin-bottom: 30px; }
.explore-btn {
  display: inline-block; padding: 11px 28px;
  border: 1.5px solid #2840a0; color: #2840a0; background: none;
  border-radius: 2px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: 'Helvetica Neue', Arial, sans-serif;
  transition: background 0.2s, color 0.2s;
}
.explore-btn:hover { background: #2840a0; color: #f0eedf; }

/* ── Multi-page modal ────────────────────── */
#modal-page-nav {
  display: none; align-items: center; justify-content: center;
  gap: 14px; margin-top: 24px; padding-top: 18px;
  border-top: 1px solid rgba(168,162,146,0.22);
}
.page-nav-btn {
  background: none; border: 1px solid rgba(168,162,146,0.5);
  color: #9a9080; width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; font-size: 14px;
  transition: background 0.18s, color 0.18s;
  display: flex; align-items: center; justify-content: center;
}
.page-nav-btn:hover:not(:disabled) { background: #e8e4dc; color: #2a2018; }
.page-nav-btn:disabled { opacity: 0.22; cursor: default; }
#modal-dots { display: flex; gap: 8px; align-items: center; }
.page-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #c0b8a8; cursor: pointer;
  transition: background 0.18s, transform 0.18s;
}
.page-dot.active { background: #2840a0; transform: scale(1.4); }
#modal-page-label {
  font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
  color: #8898b8; font-family: 'Helvetica Neue', Arial, sans-serif;
  margin-bottom: 8px; display: none;
}
#modal-caption {
  font-size: 11px; font-style: italic; color: #b0a898;
  margin-top: 8px; margin-bottom: 14px; text-align: center; display: none;
}
#modal-card.paged #modal-cover-wrap { aspect-ratio: unset; height: 280px; margin-bottom: 14px; overflow: hidden; }
#modal-card.paged #modal-title { font-size: 20px; margin-bottom: 6px; }
#modal-card.paged #modal-tag  { margin-bottom: 14px; }
#modal-card.paged #modal-desc { display: none; }
#modal-card.paged #modal-body { font-size: 13px; line-height: 1.85; color: #5a5040; font-style: normal; margin-bottom: 0; }
#modal-card.paged .explore-btn { display: none; }

/* ── Chrome ───────────────────────────────── */
#page-label { position: fixed; top: 28px; left: 36px; z-index: 100; pointer-events: none; }
#page-label h1 {
  font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase;
  color: #6878a0; font-weight: normal;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#page-label p {
  font-size: 10px; color: #8898b0; letter-spacing: 0.8px; margin-top: 5px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#hint {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2.5px; color: #8898b0; text-transform: uppercase;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
  animation: fadeOut 1.2s ease 5s forwards;
}
@keyframes fadeOut { to { opacity: 0; } }
#project-count {
  position: fixed; bottom: 28px; right: 36px;
  font-size: 10px; letter-spacing: 1.5px; color: #8898b0;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
}
</style>
</head>

<div id="page-label">

</div>
<div id="hint">Hover to reveal · Click to explore · Scroll to zoom</div>

<!-- dynamic layers injected by JS -->
<g id="river-layer"></g>

</svg>
</div>

<!-- modal -->
<div id="modal-overlay">
  <div id="modal-card">
    <button class="modal-close" id="modal-close">&#x2715;</button>

</div>

      {
        heading:"Script Development",
        caption:"Excerpt from Act II, Scene 3 — student-written",
        body:"The script was entirely student-written across four weeks of workshops. Sisyphus is reimagined as a contemporary office worker trapped in a cycle of meaningless tasks. The boulder becomes both literal and metaphorical — a projection, a pressure, a choice.",

          <rect width="${w}" height="${h}" fill="#f8f6f0"/>
          <rect x="${w*.07}" y="0" width="${w*.86}" height="${h}" fill="#faf8f4" opacity="0.9"/>

          <line x1="${w*.07}" y1="${h*.105}" x2="${w*.93}" y2="${h*.105}" stroke="#c8b898" stroke-width="0.8"/>
          <text x="${w*.5}" y="${h*.175}" font-family="Georgia,serif" font-size="${(w*.024).toFixed(1)}" fill="#9a8060" text-anchor="middle" font-style="italic">[The boulder sits centre stage. SISYPHUS stares at it. A long pause.]</text>

          <text x="${w*.5}" y="${h*.336}" font-family="Georgia,serif" font-size="${(w*.028).toFixed(1)}" fill="#2a2820" text-anchor="middle">The rock is not heavy.</text>
          <text x="${w*.5}" y="${h*.405}" font-family="Georgia,serif" font-size="${(w*.028).toFixed(1)}" fill="#2a2820" text-anchor="middle">It is perfectly heavy.</text>

          <text x="${w*.21}" y="${h*.568}" font-family="'Courier New',monospace" font-size="${(w*.028).toFixed(1)}" fill="#2a2820" text-anchor="middle" font-weight="bold">CHORUS</text>

/* ── Helpers ────────────────────────────────────────── */
const s = n => n.toFixed(1);

function spline(pts) {
  if (pts.length < 2) return '';
  let d = `M ${s(pts[0].x)},${s(pts[0].y)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i-1)];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[Math.min(pts.length-1, i+2)];
    const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    const c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += ` C ${s(c1x)},${s(c1y)} ${s(c2x)},${s(c2y)} ${s(p2.x)},${s(p2.y)}`;
  }
  return d;
}

function mk(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, String(v)));
  return el;
}
function path(d, attrs) {
  return mk('path', { d, fill:'none', 'stroke-linecap':'round', ...attrs });
}
function oshift(pts, dx, dy) { return pts.map(p=>({x:p.x+dx, y:p.y+dy})); }

/* ── Build river ────────────────────────────────────── */
function buildRiver(allPts) {
  const layer = document.getElementById('river-layer');
  const N = PROJECTS.length;
  const fullD = spline(allPts);

  /* Base washes — full path */
  layer.appendChild(path(spline(oshift(allPts,-7,-6)),  { stroke:'#7896b6','stroke-width':16, opacity:0.16 }));
  layer.appendChild(path(fullD,                          { stroke:'#88acc8','stroke-width':22, opacity:0.18 }));
  layer.appendChild(path(spline(oshift(allPts,9,7)),     { stroke:'#92b6d0','stroke-width':14, opacity:0.14 }));
  /* Lavender bleed */
  layer.appendChild(path(spline(oshift(allPts,-12,-10)), { stroke:'#a6a0ce','stroke-width':40, opacity:0.07 }));

  /* Stacked tapering segments — widen toward destination */
  PROJECTS.forEach((proj, i) => {
    const segPts = [
      {x:proj.ix, y:proj.iy},
      ...PROJECTS.slice(i+1).map(q=>({x:q.ix,y:q.iy})),
      DEST
    ];
    const w1 = (N-i)*26+18, w2 = w1*0.60;
    const op1 = 0.065+(N-i)*0.007, op2 = op1+0.026;
    const d = spline(segPts);
    layer.appendChild(path(d, { stroke:'#6898b8','stroke-width':w1, opacity:op1 }));
    layer.appendChild(path(d, { stroke:'#80aac8','stroke-width':w2, opacity:op2 }));
  });

  /* Animated frayed edge strokes */
  const frays = [
    { dx:-10, dy:-8,  w:3.5, op:0.32, dash:'44,14,58,9,38,20',  cls:'rf-a' },
    { dx: 14, dy: 10, w:3.0, op:0.26, dash:'56,11,36,20,60,8',  cls:'rf-b' },
    { dx:-20, dy:-14, w:2.5, op:0.22, dash:'32,24,48,12,44,22', cls:'rf-c' },
    { dx: 24, dy: 16, w:2.5, op:0.20, dash:'46,18,34,24,54,10', cls:'rf-d' },
    { dx: -6, dy: -5, w:2.0, op:0.18, dash:'28,26,52,14,36,24', cls:'rf-c' },
    { dx: 30, dy: 22, w:2.0, op:0.16, dash:'62,16,42,20,50,14', cls:'rf-d' },
  ];
  frays.forEach(f => {
    const el = path(spline(oshift(allPts, f.dx, f.dy)), {
      stroke:'#78a8cc', 'stroke-width':f.w, opacity:f.op, 'stroke-dasharray':f.dash
    });
    el.classList.add(f.cls);
    layer.appendChild(el);
  });

  /* Soft watercolour bleed around each waypoint */
  allPts.slice(1,-1).forEach(pt => {
    layer.appendChild(mk('ellipse', {
      cx:pt.x, cy:pt.y, rx:60, ry:36,
      fill:'#88aac4', opacity:0.055, filter:'url(#blur-md)'
    }));
  });
}

/* ── Build natural elements ─────────────────────────── */
function buildNature(allPts) {
  const layer = document.getElementById('nature-layer');

  /* Between each consecutive waypoint, place bank elements */
  for (let i = 0; i < allPts.length - 1; i++) {
    const p1 = allPts[i], p2 = allPts[i+1];
    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    const bankDist = 48 + i * 8; /* grows as river widens */

    /* Upper-left bank (reeds + water sedge) */
    const ux = mx + LX*bankDist, uy = my + LY*bankDist;
    placeReeds(layer, ux, uy, i);

    /* Lower-right bank (iris-blue marks + pebbles) */
    const lx = mx + RX*bankDist, ly = my + RY*bankDist;
    placeIris(layer, lx, ly, i);
    placeBankPebbles(layer, lx - RX*18, ly - RY*18, i);
  }

  /* Ripples and shadow around each island */
  PROJECTS.forEach(p => {
    /* Water shadow (dark ellipse on downstream side) */
    layer.appendChild(mk('ellipse', {
      cx: p.ix + RX*28, cy: p.iy + RY*18,
      rx: 52, ry: 28, fill: '#5878a0', opacity: 0.08,
      filter: 'url(#blur-sm)'
    }));
    /* Animated ripple rings */
    [0, 1.2, 2.4].forEach(delay => {
      const ring = mk('ellipse', {
        cx:p.ix, cy:p.iy, rx:72, ry:40,
        fill:'none', stroke:'#88aac8', 'stroke-width':1.2, opacity:0
      });
      const animRx = document.createElementNS(SVG_NS,'animate');
      animRx.setAttribute('attributeName','rx');
      animRx.setAttribute('from','68'); animRx.setAttribute('to','95');
      animRx.setAttribute('dur','3.6s'); animRx.setAttribute('begin',`${delay}s`);
      animRx.setAttribute('repeatCount','indefinite');
      const animRy = document.createElementNS(SVG_NS,'animate');
      animRy.setAttribute('attributeName','ry');
      animRy.setAttribute('from','38'); animRy.setAttribute('to','52');
      animRy.setAttribute('dur','3.6s'); animRy.setAttribute('begin',`${delay}s`);
      animRy.setAttribute('repeatCount','indefinite');
      const animOp = document.createElementNS(SVG_NS,'animate');
      animOp.setAttribute('attributeName','opacity');
      animOp.setAttribute('values','0.28;0.10;0');
      animOp.setAttribute('dur','3.6s'); animOp.setAttribute('begin',`${delay}s`);
      animOp.setAttribute('repeatCount','indefinite');
      ring.appendChild(animRx); ring.appendChild(animRy); ring.appendChild(animOp);
      layer.appendChild(ring);
    });
  });

  /* Floating leaf debris — tiny shapes drifting downstream */
  const leafPositions = [
    {x:180,y:818},{x:350,y:720},{x:460,y:660},{x:600,y:560},
    {x:710,y:475},{x:850,y:400},{x:980,y:315},{x:1120,y:228},{x:1250,y:140}
  ];
  leafPositions.forEach((lp, i) => {
    const leaf = mk('ellipse', {
      cx:lp.x, cy:lp.y, rx:3.5, ry:2.2, fill:'#8a9a70', opacity:0
    });
    const dur = 8 + i * 0.7;
    const ex = lp.x + 180, ey = lp.y - 120;
    const animX = document.createElementNS(SVG_NS,'animate');
    animX.setAttribute('attributeName','cx'); animX.setAttribute('from',lp.x); animX.setAttribute('to',ex);
    animX.setAttribute('dur',`${dur}s`); animX.setAttribute('begin',`${i*0.9}s`); animX.setAttribute('repeatCount','indefinite');
    const animY = document.createElementNS(SVG_NS,'animate');
    animY.setAttribute('attributeName','cy'); animY.setAttribute('from',lp.y); animY.setAttribute('to',ey);
    animY.setAttribute('dur',`${dur}s`); animY.setAttribute('begin',`${i*0.9}s`); animY.setAttribute('repeatCount','indefinite');
    const animOp = document.createElementNS(SVG_NS,'animate');
    animOp.setAttribute('attributeName','opacity');
    animOp.setAttribute('values',`0;0.52;0.52;0`);
    animOp.setAttribute('dur',`${dur}s`); animOp.setAttribute('begin',`${i*0.9}s`); animOp.setAttribute('repeatCount','indefinite');
    leaf.appendChild(animX); leaf.appendChild(animY); leaf.appendChild(animOp);
    layer.appendChild(leaf);
  });
}

/* Reed cluster (upper-left bank) */
function placeReeds(layer, cx, cy, seed) {
  const offsets = [[-8,2],[0,-4],[9,1],[-3,8],[14,-2]];
  const count = 3 + (seed % 3);
  offsets.slice(0, count).forEach(([ox, oy]) => {
    const x = cx+ox, y = cy+oy, h = 22+(seed*7+ox*3)%14;
    /* stem */
    layer.appendChild(path(`M ${s(x)},${s(y)} C ${s(x-2)},${s(y-h*.3)} ${s(x+1)},${s(y-h*.7)} ${s(x)},${s(y-h)}`, {
      stroke:'#7a8a60','stroke-width':1.1, opacity:0.52
    }));
    /* leaf blade */
    layer.appendChild(path(`M ${s(x)},${s(y-h*.4)} Q ${s(x+8)},${s(y-h*.6)} ${s(x+12)},${s(y-h*.8)}`, {
      stroke:'#8a9a68','stroke-width':1.0, opacity:0.40
    }));
    /* cattail head */
    layer.appendChild(mk('ellipse', {
      cx:x, cy:y-h, rx:2.2, ry:6.5, fill:'#5a4828', opacity:0.68
    }));
  });
}

/* Iris/water-plant marks in ultramarine (lower-right bank) */
function placeIris(layer, cx, cy, seed) {
  const count = 2 + (seed % 2);
  const clusterOffsets = [[-5,0],[6,3],[-2,-6],[10,-2]];
  clusterOffsets.slice(0, count).forEach(([ox, oy]) => {
    const x = cx+ox, y = cy+oy;
    /* three petal suggestion */
    const angles = [260, 20, 140];
    angles.forEach(deg => {
      const r = deg * Math.PI / 180;
      const px = x + Math.cos(r)*9, py = y + Math.sin(r)*9;
      layer.appendChild(path(`M ${s(x)},${s(y)} Q ${s(x+Math.cos(r)*5)},${s(y+Math.sin(r)*5)} ${s(px)},${s(py)}`, {
        stroke:'#2840a0','stroke-width':1.8, opacity:0.40
      }));
    });
    layer.appendChild(mk('circle', { cx:x, cy:y, r:2, fill:'#3050b8', opacity:0.46 }));
    /* stem */
    layer.appendChild(path(`M ${s(x)},${s(y)} L ${s(x)},${s(y+14)}`, {
      stroke:'#507860','stroke-width':1.0, opacity:0.38
    }));
  });
}

/* Bank pebble cluster */
function placeBankPebbles(layer, cx, cy, seed) {
  const sizes = [4,3,2.5,2,3.5,2,4.5];
  const pos   = [[0,0],[8,4],[-6,3],[12,-2],[-10,6],[16,0],[-4,-5]];
  const count = 3 + (seed % 4);
  pos.slice(0,count).forEach(([ox,oy], j) => {
    layer.appendChild(mk('ellipse', {
      cx: cx+ox, cy: cy+oy,
      rx: sizes[j%sizes.length], ry: sizes[j%sizes.length]*0.70,
      fill:'#8a8478', opacity:0.42+(j%3)*0.06
    }));
  });
}

/* ── Build islands ──────────────────────────────────── */
function buildIslands() {
  const layer = document.getElementById('island-layer');
  PROJECTS.forEach(p => {
    /* Mist spray upstream */
    [{dx:-54,dy:-4,rx:60,ry:28,op:0.18},{dx:46,dy:10,rx:52,ry:26,op:0.14},{dx:0,dy:-40,rx:40,ry:22,op:0.10}]
    .forEach(m => layer.appendChild(mk('ellipse',{
      cx:p.ix+m.dx, cy:p.iy+m.dy, rx:m.rx, ry:m.ry,
      fill:'#b0c0d2', opacity:m.op, filter:'url(#blur-md)'
    })));
    /* Island body */
    layer.appendChild(mk('ellipse',{cx:p.ix,    cy:p.iy,    rx:65, ry:40, fill:'#beba9a', opacity:0.62}));
    layer.appendChild(mk('ellipse',{cx:p.ix-5,  cy:p.iy-5,  rx:52, ry:32, fill:'#ccc6a4', opacity:0.52}));
    layer.appendChild(mk('ellipse',{cx:p.ix,    cy:p.iy,    rx:72, ry:46, fill:'#b6b294', opacity:0.18, filter:'url(#blur-sm)'}));
    /* Small lichen/grass tuft on island */
    layer.appendChild(mk('ellipse',{cx:p.ix+20, cy:p.iy-6,  rx:8,  ry:5,  fill:'#7a8a60', opacity:0.38}));
    layer.appendChild(mk('ellipse',{cx:p.ix-16, cy:p.iy+8,  rx:6,  ry:4,  fill:'#8a9a6a', opacity:0.30}));
  });
}

/* ── Stone card back ────────────────────────────────── */
function makeBack(id, w, h) {
  const v = [
    {e1:[.30,.34],e2:[.68,.62],lx:[.15,.82],ly:[.74,.68]},
    {e1:[.50,.36],e2:[.48,.66],lx:[.13,.85],ly:[.70,.74]},
    {e1:[.72,.28],e2:[.30,.68],lx:[.17,.80],ly:[.76,.70]},
    {e1:[.36,.60],e2:[.64,.34],lx:[.14,.83],ly:[.72,.66]},
    {e1:[.56,.44],e2:[.44,.62],lx:[.16,.80],ly:[.75,.69]},
    {e1:[.28,.38],e2:[.70,.60],lx:[.15,.82],ly:[.73,.67]},
    {e1:[.60,.32],e2:[.40,.64],lx:[.18,.78],ly:[.76,.70]},
    {e1:[.44,.56],e2:[.58,.38],lx:[.14,.84],ly:[.71,.65]},
    {e1:[.52,.40],e2:[.48,.60],lx:[.16,.82],ly:[.74,.68]},
    {e1:[.32,.46],e2:[.66,.58],lx:[.15,.80],ly:[.73,.67]},
  ][id-1];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="#9aaebe"/>
    <ellipse cx="${s(w*v.e1[0])}" cy="${s(h*v.e1[1])}" rx="${s(w*.72)}" ry="${s(h*.66)}" fill="#aec0d0" opacity="0.44"/>
    <ellipse cx="${s(w*v.e2[0])}" cy="${s(h*v.e2[1])}" rx="${s(w*.58)}" ry="${s(h*.54)}" fill="#90a8c0" opacity="0.36"/>
    <ellipse cx="${s(w*.5)}" cy="${s(h*.18)}" rx="${s(w*.54)}" ry="${s(h*.18)}" fill="#c2d4e4" opacity="0.26"/>
    <ellipse cx="${s(w*.5)}" cy="${s(h*.86)}" rx="${s(w*.50)}" ry="${s(h*.14)}" fill="#86a0b8" opacity="0.20"/>
    <!-- lichen patches — stone surface texture -->
    <ellipse cx="${s(w*.34)}" cy="${s(h*.42)}" rx="${s(w*.10)}" ry="${s(h*.06)}" fill="#98a888" opacity="0.30"/>
    <ellipse cx="${s(w*.64)}" cy="${s(h*.58)}" rx="${s(w*.08)}" ry="${s(h*.05)}" fill="#8a9878" opacity="0.24"/>
    <!-- ultramarine waterline mark -->
    <path d="M ${s(w*v.lx[0])},${s(h*v.ly[0])} C ${s(w*.40)},${s(h*(v.ly[0]-.05))} ${s(w*.62)},${s(h*(v.ly[1]+.04))} ${s(w*v.lx[1])},${s(h*v.ly[1])}"
      stroke="#2840a0" stroke-width="${s(w*.024)}" fill="none" opacity="0.50" stroke-linecap="round"/>
    <circle cx="${s(w*.18)}" cy="${s(h*.83)}" r="${s(w*.034)}" fill="#2840a0" opacity="0.36"/>
    <circle cx="${s(w*.28)}" cy="${s(h*.87)}" r="${s(w*.022)}" fill="#2840a0" opacity="0.28"/>
    <line x1="${s(w*.65)}" y1="${s(h*.13)}" x2="${s(w*.80)}" y2="${s(h*.16)}" stroke="#3050b8" stroke-width="${s(w*.016)}" opacity="0.30" stroke-linecap="round"/>
  </svg>`;
}

/* ── Build cards ────────────────────────────────────── */
function buildCards() {
  const layer = document.getElementById('card-layer');
  const CW = 70, CH = 94, FOW = 98, FOH = 124;
  const pivotOffY = 14; /* wobble pivot at stone base */

  PROJECTS.forEach(p => {
    /* Wrap in animateTransform group for current-wobble */
    const wobbleG = document.createElementNS(SVG_NS, 'g');
    const anim = document.createElementNS(SVG_NS, 'animateTransform');
    anim.setAttribute('attributeName','transform');
    anim.setAttribute('type','rotate');
    const dur = 5.2 + p.id * 0.72;
    const delay = p.id * 0.65;
    const cx = s(p.ix), cy = s(p.iy + pivotOffY);
    anim.setAttribute('values',`0 ${cx} ${cy}; 1.3 ${cx} ${cy}; -0.8 ${cx} ${cy}; 0.5 ${cx} ${cy}; 0 ${cx} ${cy}`);
    anim.setAttribute('dur',`${dur}s`);
    anim.setAttribute('begin',`${delay}s`);
    anim.setAttribute('repeatCount','indefinite');
    anim.setAttribute('calcMode','spline');
    anim.setAttribute('keyTimes','0;0.25;0.55;0.80;1');
    anim.setAttribute('keySplines','0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1');
    wobbleG.appendChild(anim);

    const fo = document.createElementNS(SVG_NS, 'foreignObject');
    fo.setAttribute('x',  p.ix - FOW/2);
    fo.setAttribute('y',  p.iy - CH * 0.90);
    fo.setAttribute('width',  FOW);
    fo.setAttribute('height', FOH);
    fo.setAttribute('overflow','visible');

    const outer = document.createElementNS(XHTML_NS,'div');
    outer.className = 'card-fo-wrap';
    outer.style.cssText = `width:${FOW}px;height:${FOH}px;`;

    const wrap = document.createElementNS(XHTML_NS,'div');
    wrap.className = 'card-wrap';

    const inner = document.createElementNS(XHTML_NS,'div');
    inner.className = 'card-inner';
    inner.dataset.id = p.id;

    const back = document.createElementNS(XHTML_NS,'div');
    back.className = 'card-face card-back';
    back.dataset.stone = p.id;
    back.innerHTML = makeBack(p.id, CW, CH);

    const front = document.createElementNS(XHTML_NS,'div');
    front.className = 'card-face card-front';
    front.dataset.stone = p.id;
    front.innerHTML = p.makeCover(CW, CH);

    inner.appendChild(back);
    inner.appendChild(front);
    wrap.appendChild(inner);
    outer.appendChild(wrap);
    fo.appendChild(outer);
    wobbleG.appendChild(fo);
    layer.appendChild(wobbleG);

    inner.addEventListener('click', () => openDetail(p.id));
  });
}

/* ── Modal ──────────────────────────────────────────── */
let _proj = null, _page = 0;

function openDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  _proj = p; _page = 0;

  const card = document.getElementById('modal-card');
  document.getElementById('modal-title').textContent = p.title;
  const tag = document.getElementById('modal-tag');
  tag.textContent = p.tag; tag.style.background = p.tagBg; tag.style.color = p.tagFg;

  if (p.pages) {
    card.classList.add('paged');
    /* build dots */
    const dotsEl = document.getElementById('modal-dots');
    dotsEl.innerHTML = '';
    p.pages.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'page-dot';
      d.addEventListener('click', () => renderPage(i));
      dotsEl.appendChild(d);
    });
    document.getElementById('modal-page-nav').style.display    = 'flex';
    document.getElementById('modal-page-label').style.display  = 'block';
    document.getElementById('modal-caption').style.display     = 'block';
    document.getElementById('modal-explore').style.display     = 'none';
    document.getElementById('modal-desc').style.display        = 'none';
    renderPage(0);
  } else {
    card.classList.remove('paged');
    document.getElementById('modal-cover-wrap').innerHTML = p.makeCover(420, 560);
    document.getElementById('modal-desc').textContent    = p.desc;
    document.getElementById('modal-desc').style.display  = 'block';
    document.getElementById('modal-body').textContent    = p.body;
    document.getElementById('modal-page-nav').style.display    = 'none';
    document.getElementById('modal-page-label').style.display  = 'none';
    document.getElementById('modal-caption').style.display     = 'none';
    document.getElementById('modal-explore').style.display     = 'inline-block';
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function renderPage(idx) {
  if (!_proj || !_proj.pages) return;
  _page = idx;
  const pg = _proj.pages[idx];
  document.getElementById('modal-cover-wrap').innerHTML = pg.photo(420, 255);
  document.getElementById('modal-page-label').textContent =
    `${idx + 1} of ${_proj.pages.length} — ${pg.heading}`;
  document.getElementById('modal-caption').textContent = pg.caption;
  document.getElementById('modal-body').textContent    = pg.body;
  document.querySelectorAll('.page-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('modal-prev').disabled = idx === 0;
  document.getElementById('modal-next').disabled = idx === _proj.pages.length - 1;
}

document.getElementById('modal-prev').addEventListener('click', () => { if (_page > 0) renderPage(_page - 1); });
document.getElementById('modal-next').addEventListener('click', () => { if (_proj && _page < _proj.pages.length - 1) renderPage(_page + 1); });

function closeDetail() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-close').addEventListener('click', closeDetail);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeDetail();
});

/* ── Scroll-to-zoom ────────────────────────────────── */
(function() {
  const svgEl  = document.getElementById('river-svg');
  let zoom = 1.0;
  const ZOOM_MIN = 1.0, ZOOM_MAX = 1.50, STEP = 0.05;

  svgEl.style.transition      = 'transform 0.30s cubic-bezier(0.25,0.46,0.45,0.94)';
  svgEl.style.willChange      = 'transform';

  document.getElementById('explorer').addEventListener('wheel', e => {
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom + dir * STEP));

    /* Keep zoom centred on cursor */
    const rect = svgEl.getBoundingClientRect();
    const ox = ((e.clientX - rect.left) / rect.width  * 100).toFixed(2) + '%';
    const oy = ((e.clientY - rect.top)  / rect.height * 100).toFixed(2) + '%';
    svgEl.style.transformOrigin = `${ox} ${oy}`;
    svgEl.style.transform       = `scale(${zoom})`;
  }, { passive: false });
})();

/* ── Init ───────────────────────────────────────────── */
const allPts = [SRC, ...PROJECTS.map(p=>({x:p.ix,y:p.iy})), DEST];
buildRiver(allPts);
buildNature(allPts);
buildIslands();
buildCards();
document.getElementById('project-count').textContent = `${PROJECTS.length} projects`;
</script>
