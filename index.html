<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Growing Tree — Project Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ece8de;
  font-family: Georgia, serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#explorer { position: relative; width: 100vw; height: 100vh; }

#tree-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ── Project cards ──────────────────────────────────── */
.project-card {
  width: 120px;
  height: 160px;
  cursor: pointer;
  background: #fff;
  /* organic clip-path per card id */
  transition: filter 0.38s ease, transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
}

/* Five distinct organic silhouettes */
.project-card[data-id="1"] {
  clip-path: path('M 60,6 C 84,0 115,18 118,58 C 121,98 102,146 68,156 C 34,166 2,142 2,96 C 2,50 36,12 60,6 Z');
}
.project-card[data-id="2"] {
  clip-path: path('M 58,4 C 82,0 113,22 115,65 C 117,108 94,155 58,158 C 22,161 -2,118 4,72 C 10,26 34,8 58,4 Z');
}
.project-card[data-id="3"] {
  clip-path: path('M 60,5 C 92,2 118,28 116,68 C 114,108 88,155 60,157 C 32,159 4,108 4,68 C 4,28 28,8 60,5 Z');
}
.project-card[data-id="4"] {
  clip-path: path('M 55,3 C 78,-2 108,16 112,55 C 116,94 102,145 66,157 C 30,169 -2,140 4,90 C 10,40 32,8 55,3 Z');
}
.project-card[data-id="5"] {
  clip-path: path('M 62,5 C 90,0 118,22 116,66 C 114,110 88,156 56,157 C 24,158 -2,115 4,68 C 10,21 34,10 62,5 Z');
}

/* Lightbulb hover glow — radiates from organic silhouette */
.project-card:hover {
  filter: brightness(1.12)
          drop-shadow(0 0 10px rgba(255,218,58,1))
          drop-shadow(0 0 28px rgba(255,192,28,0.82))
          drop-shadow(0 0 60px rgba(255,158,0,0.46));
  transform: scale(1.1) translateY(-5px);
}

/* SVG stem-glow lines (toggled by JS) */
.stem-glow {
  opacity: 0;
  transition: opacity 0.38s ease;
  pointer-events: none;
}

/* ── Detail panel ───────────────────────────────────── */
#detail-panel {
  position: fixed;
  right: 0; top: 0;
  width: 420px;
  height: 100vh;
  background: #faf8f2;
  border-left: 1px solid #d8d0bc;
  transform: translateX(100%);
  transition: transform 0.42s cubic-bezier(0.4,0,0.2,1);
  z-index: 300;
  overflow-y: auto;
  padding: 52px 38px 48px;
}
#detail-panel.open { transform: translateX(0); }

.close-btn {
  position: absolute; top: 18px; right: 18px;
  background: none; border: none;
  font-size: 20px; cursor: pointer; color: #aaa;
  padding: 6px 10px; border-radius: 50%;
  transition: color 0.2s, background 0.2s; line-height: 1;
}
.close-btn:hover { color: #333; background: #eee8d8; }

#detail-cover-wrap {
  width: 100%; border-radius: 4px; overflow: hidden;
  margin-bottom: 30px;
  box-shadow: 0 10px 36px rgba(0,0,0,0.14);
  aspect-ratio: 3/4;
}
#detail-cover-wrap svg { width: 100%; height: 100%; display: block; }

#detail-title {
  font-size: 26px; font-weight: normal; color: #181818;
  margin-bottom: 10px; letter-spacing: 0.2px; line-height: 1.3;
}
.detail-tag {
  display: inline-block; font-size: 10px;
  letter-spacing: 1.8px; text-transform: uppercase;
  padding: 5px 13px; border-radius: 20px; margin-bottom: 22px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#detail-desc { font-size: 14.5px; line-height: 1.9; color: #444; margin-bottom: 18px; }
#detail-body { font-size: 13.5px; line-height: 1.95; color: #888; font-style: italic; margin-bottom: 32px; }

.explore-btn {
  display: inline-block; padding: 12px 30px;
  border: 1.5px solid #3d5a3e; color: #3d5a3e;
  background: none; border-radius: 2px;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: 'Helvetica Neue', Arial, sans-serif;
  transition: background 0.2s, color 0.2s;
}
.explore-btn:hover { background: #3d5a3e; color: #f0eedf; }

#overlay {
  position: fixed; inset: 0;
  background: rgba(20,18,10,0.18);
  z-index: 299; display: none;
  backdrop-filter: blur(2px);
}
#overlay.visible { display: block; }

/* ── Page chrome ────────────────────────────────────── */
#page-label {
  position: fixed; top: 30px; left: 38px;
  z-index: 100; pointer-events: none;
}
#page-label h1 {
  font-size: 11.5px; letter-spacing: 3.5px; text-transform: uppercase;
  color: #9a8e7c; font-weight: normal;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#page-label p {
  font-size: 10px; color: #c0b8a8; letter-spacing: 0.8px; margin-top: 6px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#hint {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2.5px; color: #c0b8a8; text-transform: uppercase;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
  animation: fadeOut 1.2s ease 4s forwards;
}
@keyframes fadeOut { to { opacity: 0; } }
#project-count {
  position: fixed; bottom: 30px; right: 38px;
  font-size: 10px; letter-spacing: 1.5px; color: #b8ae9c;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
}
</style>
</head>

/* ── Render covers ───────────────────────────────────────────── */
function renderCards() {
  PROJECTS.forEach(p => {
    const el = document.querySelector(`.project-card[data-id="${p.id}"]`);
    if (el) el.innerHTML = p.makeCover(120, 160);
  });
}

/* ── Detail panel ────────────────────────────────────────────── */
function openDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('detail-cover-wrap').innerHTML = p.makeCover(360, 480);
  document.getElementById('detail-title').textContent = p.title;
  const tag = document.getElementById('detail-tag');
  tag.textContent = p.tag;
  tag.style.background = p.tagBg;
  tag.style.color = p.tagFg;
  document.getElementById('detail-desc').textContent = p.desc;
  document.getElementById('detail-body').textContent = p.body;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

/* ── Stem glow on card hover ─────────────────────────────────── */
document.getElementById('tree-svg').addEventListener('click', e => {
  const card = e.target.closest('.project-card');
  if (card) openDetail(Number(card.dataset.id));
});

document.querySelectorAll('.project-card').forEach(card => {
  const id = card.dataset.id;
  const stem = document.getElementById(`stem-${id}`);
  card.addEventListener('mouseenter', () => { if (stem) stem.style.opacity = '0.85'; });
  card.addEventListener('mouseleave', () => { if (stem) stem.style.opacity = '0'; });
});

/* ── Close handlers ──────────────────────────────────────────── */
document.getElementById('close-btn').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', closeDetail);

/* ── Init ────────────────────────────────────────────────────── */
renderCards();
document.getElementById('project-count').textContent = `${PROJECTS.length} projects`;

/*
 * Adding a new project:
 * 1. Push a new object into PROJECTS with the next id.
 * 2. Add a <foreignObject> in the SVG pointing to a branch tip.
 * 3. Add a matching <path id="stem-N" class="stem-glow"> duplicating the branch path.
 * renderCards() handles the rest automatically.
 */
</script>
</body>
</html>
