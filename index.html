<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The River — Project Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ccd0d6;
  font-family: Georgia, serif;
  overflow: hidden;
  height: 100vh; width: 100vw;
}

#explorer { position: relative; width: 100vw; height: 100vh; }

#river-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}

/* ── Card flip ─────────────────────────────── */
.card-fo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-wrap {
  width: 88px; height: 118px;
  perspective: 720px;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.54s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer;
}
.card-inner.revealed {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 3px;
  overflow: hidden;
}
.card-back svg,
.card-front svg { width: 100%; height: 100%; display: block; }
.card-front { transform: rotateY(180deg); }

.card-inner.revealed {
  filter: drop-shadow(0 2px 8px rgba(10,20,40,0.22));
}
.card-inner.revealed:hover {
  filter: drop-shadow(0 0 9px rgba(255,204,40,0.9))
          drop-shadow(0 0 26px rgba(255,170,20,0.55));
}

/* ── Modal ─────────────────────────────────── */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(190,200,212,0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.32s ease;
}
#modal-overlay.open { opacity: 1; pointer-events: auto; }

#modal-card {
  background: rgba(246,244,240,0.96);
  border: 1px solid rgba(170,164,148,0.5);
  border-radius: 6px;
  box-shadow: 0 22px 64px rgba(10,18,30,0.22);
  width: min(500px, 88vw);
  max-height: 88vh;
  overflow-y: auto;
  padding: 42px 40px 46px;
  position: relative;
  transform: scale(0.86);
  transition: transform 0.38s cubic-bezier(0.34,1.4,0.64,1);
}
#modal-overlay.open #modal-card { transform: scale(1); }

.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none; font-size: 18px;
  cursor: pointer; color: #9ea8b2;
  padding: 6px 10px; border-radius: 50%;
  transition: color 0.2s, background 0.2s; line-height: 1;
}
.modal-close:hover { color: #222; background: #e4e0d8; }

#modal-cover-wrap {
  width: 100%; border-radius: 4px; overflow: hidden;
  margin-bottom: 26px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  aspect-ratio: 3/4;
}
#modal-cover-wrap svg { width: 100%; height: 100%; display: block; }

#modal-title {
  font-size: 24px; font-weight: normal; color: #181818;
  margin-bottom: 9px; line-height: 1.3;
}
.modal-tag {
  display: inline-block; font-size: 10px;
  letter-spacing: 1.8px; text-transform: uppercase;
  padding: 4px 12px; border-radius: 20px; margin-bottom: 18px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#modal-desc { font-size: 14px; line-height: 1.9; color: #444; margin-bottom: 14px; }
#modal-body { font-size: 13px; line-height: 1.95; color: #888; font-style: italic; margin-bottom: 30px; }

.explore-btn {
  display: inline-block; padding: 11px 28px;
  border: 1.5px solid #2840a0; color: #2840a0;
  background: none; border-radius: 2px;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: 'Helvetica Neue', Arial, sans-serif;
  transition: background 0.2s, color 0.2s;
}
.explore-btn:hover { background: #2840a0; color: #f0eedf; }

/* ── Page chrome ────────────────────────────── */
#page-label {
  position: fixed; top: 28px; left: 36px;
  z-index: 100; pointer-events: none;
}
#page-label h1 {
  font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase;
  color: #7080a0; font-weight: normal;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#page-label p {
  font-size: 10px; color: #90a0b4; letter-spacing: 0.8px; margin-top: 5px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#hint {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2.5px; color: #90a0b4; text-transform: uppercase;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
  animation: fadeOut 1.2s ease 5s forwards;
}
@keyframes fadeOut { to { opacity: 0; } }
#project-count {
  position: fixed; bottom: 28px; right: 36px;
  font-size: 10px; letter-spacing: 1.5px; color: #90a0b4;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
}
</style>
</head>

/* ── Catmull-Rom spline through waypoints ───────────────── */
function splinePath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

function offsetPts(pts, dx, dy) {
  return pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
}

function svgPath(d, attrs) {
  const el = document.createElementNS(SVG_NS, 'path');
  el.setAttribute('d', d);
  el.setAttribute('fill', 'none');
  el.setAttribute('stroke-linecap', 'round');
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

/* ── Build the river ────────────────────────────────────── */
function buildRiver() {
  const layer = document.getElementById('river-layer');
  const N = PROJECTS.length;
  const allPts = [SRC, ...PROJECTS.map(p => ({ x: p.ix, y: p.iy })), DEST];
  const fullD  = splinePath(allPts);

  /* Base thin washes — full path */
  layer.appendChild(svgPath(splinePath(offsetPts(allPts, -6, -5)), {
    stroke: '#7898b8', 'stroke-width': 16, opacity: 0.16
  }));
  layer.appendChild(svgPath(fullD, {
    stroke: '#8aaec8', 'stroke-width': 22, opacity: 0.18
  }));
  layer.appendChild(svgPath(splinePath(offsetPts(allPts, 8, 6)), {
    stroke: '#94b8d0', 'stroke-width': 14, opacity: 0.14
  }));

  /* Stacked wider segments from each island to destination:
     wider toward the top-right as the river gathers volume */
  PROJECTS.forEach((proj, i) => {
    const segPts = [
      { x: proj.ix, y: proj.iy },
      ...PROJECTS.slice(i + 1).map(q => ({ x: q.ix, y: q.iy })),
      DEST
    ];
    const w1 = (N - i) * 24 + 20;
    const w2 = w1 * 0.65;
    const op1 = 0.075 + (N - i) * 0.008;
    const op2 = op1 + 0.025;
    const d = splinePath(segPts);
    layer.appendChild(svgPath(d, { stroke: '#6898b8', 'stroke-width': w1, opacity: op1 }));
    layer.appendChild(svgPath(d, { stroke: '#82aec8', 'stroke-width': w2, opacity: op2 }));
  });

  /* Lavender atmosphere wash */
  layer.appendChild(svgPath(splinePath(offsetPts(allPts, -10, -8)), {
    stroke: '#a8a0cc', 'stroke-width': 38, opacity: 0.07
  }));

  /* Dry-brush frayed edge strokes */
  const frays = [
    { dx: -10, dy: -8,  w: 3.0, op: 0.18, dash: '42,14,58,9,38,18' },
    { dx:  14, dy:  10, w: 2.5, op: 0.15, dash: '55,11,36,19,62,8' },
    { dx: -18, dy: -13, w: 2.0, op: 0.12, dash: '32,22,48,11,44,20' },
    { dx:  22, dy:  15, w: 2.0, op: 0.13, dash: '46,16,34,22,56,10' },
    { dx:  -6, dy:  -5, w: 1.5, op: 0.10, dash: '28,24,52,12,36,22' },
    { dx:  28, dy:  20, w: 1.5, op: 0.09, dash: '60,14,40,18,50,12' },
  ];
  frays.forEach(f => {
    const el = svgPath(splinePath(offsetPts(allPts, f.dx, f.dy)), {
      stroke: '#6090b2', 'stroke-width': f.w, opacity: f.op,
      'stroke-dasharray': f.dash
    });
    layer.appendChild(el);
  });

  /* Subtle watercolour bleed blobs along the river */
  allPts.slice(1, -1).forEach(pt => {
    layer.appendChild(svgEl('ellipse', {
      cx: pt.x, cy: pt.y, rx: 55, ry: 34,
      fill: '#8aaec4', opacity: 0.06,
      filter: 'url(#blur-md)'
    }));
  });
}

/* ── Build islands ──────────────────────────────────────── */
function buildIslands() {
  const layer = document.getElementById('island-layer');

  PROJECTS.forEach(p => {
    /* Mist spray (drawn first, behind island) */
    [
      { dx: -52, dy: -5,  rx: 58, ry: 30, fill: '#b4c4d4', op: 0.18 },
      { dx:  46, dy:  9,  rx: 50, ry: 26, fill: '#b8c8d6', op: 0.14 },
      { dx:  -2, dy: -38, rx: 42, ry: 22, fill: '#b0b8d0', op: 0.10 },
    ].forEach(m => {
      layer.appendChild(svgEl('ellipse', {
        cx: p.ix + m.dx, cy: p.iy + m.dy,
        rx: m.rx, ry: m.ry,
        fill: m.fill, opacity: m.op,
        filter: 'url(#blur-md)'
      }));
    });

    /* Island body */
    layer.appendChild(svgEl('ellipse', {
      cx: p.ix, cy: p.iy, rx: 66, ry: 42,
      fill: '#c2ba9a', opacity: 0.60
    }));
    layer.appendChild(svgEl('ellipse', {
      cx: p.ix - 5, cy: p.iy - 5, rx: 52, ry: 33,
      fill: '#cec6a4', opacity: 0.52
    }));
    /* Soft edge glow */
    layer.appendChild(svgEl('ellipse', {
      cx: p.ix, cy: p.iy, rx: 72, ry: 46,
      fill: '#bab29a', opacity: 0.20,
      filter: 'url(#blur-sm)'
    }));

    /* Sparse Pootoogook pebble marks on island */
    layer.appendChild(svgEl('circle', {
      cx: p.ix + 22, cy: p.iy + 8, r: 3.5,
      fill: '#8a8070', opacity: 0.55
    }));
    layer.appendChild(svgEl('circle', {
      cx: p.ix - 18, cy: p.iy + 12, r: 2.5,
      fill: '#8a8070', opacity: 0.42
    }));
    layer.appendChild(svgEl('circle', {
      cx: p.ix + 8,  cy: p.iy + 16, r: 2,
      fill: '#9a9082', opacity: 0.36
    }));
  });
}

/* ── Card backs (Turner + Pootoogook watercolour) ───────── */
function makeBack(id, w, h) {
  const v = [
    { e1: [0.30, 0.35], e2: [0.68, 0.60], lx: [0.16, 0.74], ly: [0.74, 0.68] },
    { e1: [0.50, 0.38], e2: [0.48, 0.64], lx: [0.14, 0.84], ly: [0.70, 0.74] },
    { e1: [0.72, 0.30], e2: [0.32, 0.66], lx: [0.18, 0.80], ly: [0.76, 0.70] },
    { e1: [0.38, 0.58], e2: [0.62, 0.36], lx: [0.15, 0.82], ly: [0.72, 0.66] },
    { e1: [0.56, 0.44], e2: [0.44, 0.60], lx: [0.17, 0.78], ly: [0.75, 0.69] },
  ][id - 1];
  const s = (n) => n.toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="#9aaec0"/>
    <ellipse cx="${s(w*v.e1[0])}" cy="${s(h*v.e1[1])}" rx="${s(w*.70)}" ry="${s(h*.65)}" fill="#b0c2d4" opacity="0.44"/>
    <ellipse cx="${s(w*v.e2[0])}" cy="${s(h*v.e2[1])}" rx="${s(w*.58)}" ry="${s(h*.54)}" fill="#92aaC2" opacity="0.38"/>
    <ellipse cx="${s(w*.5)}" cy="${s(h*.20)}" rx="${s(w*.52)}" ry="${s(h*.20)}" fill="#c4d4e4" opacity="0.28"/>
    <ellipse cx="${s(w*.5)}" cy="${s(h*.85)}" rx="${s(w*.48)}" ry="${s(h*.16)}" fill="#88a0b8" opacity="0.20"/>
    <path d="M ${s(w*v.lx[0])},${s(h*v.ly[0])} C ${s(w*.38)},${s(h*(v.ly[0]-.04))} ${s(w*.64)},${s(h*(v.ly[1]+.03))} ${s(w*v.lx[1])},${s(h*v.ly[1])}"
      stroke="#2840a0" stroke-width="${s(w*.024)}" fill="none" opacity="0.52" stroke-linecap="round"/>
    <circle cx="${s(w*.20)}" cy="${s(h*.84)}" r="${s(w*.035)}" fill="#2840a0" opacity="0.38"/>
    <circle cx="${s(w*.29)}" cy="${s(h*.87)}" r="${s(w*.022)}" fill="#2840a0" opacity="0.28"/>
    <line x1="${s(w*.64)}" y1="${s(h*.14)}" x2="${s(w*.78)}" y2="${s(h*.17)}" stroke="#3050b8" stroke-width="${s(w*.016)}" opacity="0.32" stroke-linecap="round"/>
  </svg>`;
}

/* ── Build cards ────────────────────────────────────────── */
function buildCards() {
  const layer = document.getElementById('card-layer');
  const CW = 88, CH = 118;   /* card face dimensions */
  const FOW = 112, FOH = 152; /* foreignObject (slightly larger for 3-D flip room) */

  PROJECTS.forEach(p => {
    const fo = document.createElementNS(SVG_NS, 'foreignObject');
    fo.setAttribute('x',  p.ix - FOW / 2);
    fo.setAttribute('y',  p.iy - CH * 0.88); /* card sits on island */
    fo.setAttribute('width',  FOW);
    fo.setAttribute('height', FOH);
    fo.setAttribute('overflow', 'visible');

    const outer = document.createElementNS(XHTML_NS, 'div');
    outer.className = 'card-fo-wrap';
    outer.style.cssText = `width:${FOW}px;height:${FOH}px;`;

    const wrap = document.createElementNS(XHTML_NS, 'div');
    wrap.className = 'card-wrap';

    const inner = document.createElementNS(XHTML_NS, 'div');
    inner.className = 'card-inner';
    inner.dataset.id = p.id;

    const back = document.createElementNS(XHTML_NS, 'div');
    back.className = 'card-face card-back';
    back.innerHTML = makeBack(p.id, CW, CH);

    const front = document.createElementNS(XHTML_NS, 'div');
    front.className = 'card-face card-front';
    front.innerHTML = p.makeCover(CW, CH);

    inner.appendChild(back);
    inner.appendChild(front);
    wrap.appendChild(inner);
    outer.appendChild(wrap);
    fo.appendChild(outer);
    layer.appendChild(fo);

    inner.addEventListener('mouseenter', () => inner.classList.add('revealed'));
    inner.addEventListener('mouseleave', () => inner.classList.remove('revealed'));
    inner.addEventListener('click',      () => openDetail(p.id));
  });
}

/* ── Modal ──────────────────────────────────────────────── */
function openDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modal-cover-wrap').innerHTML = p.makeCover(460, 614);
  document.getElementById('modal-title').textContent    = p.title;
  const tag = document.getElementById('modal-tag');
  tag.textContent     = p.tag;
  tag.style.background = p.tagBg;
  tag.style.color      = p.tagFg;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-body').textContent = p.body;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-close').addEventListener('click', closeDetail);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeDetail();
});

/* ── Init ───────────────────────────────────────────────── */
buildRiver();
buildIslands();
buildCards();
document.getElementById('project-count').textContent = `${PROJECTS.length} projects`;
</script>
