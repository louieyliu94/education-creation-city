<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Growing Tree — Project Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0ead8;
  font-family: Georgia, serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#explorer { position: relative; width: 100vw; height: 100vh; }

#tree-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ── Project cards ─────────────────────────── */
.project-card {
  width: 120px;
  height: 160px;
  cursor: pointer;
  background: #fff;
  transition: filter 0.38s ease, transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
}

.project-card[data-id="1"] {
  clip-path: path('M 55,8 C 86,-4 124,14 126,58 C 128,102 106,154 66,164 C 26,174 -6,144 2,90 C 10,36 24,20 55,8 Z');
}
.project-card[data-id="2"] {
  clip-path: path('M 64,4 C 94,-6 124,20 120,70 C 116,120 88,160 52,162 C 16,164 -8,120 0,68 C 8,16 34,14 64,4 Z');
}
.project-card[data-id="3"] {
  clip-path: path('M 58,6 C 96,0 124,32 120,76 C 116,120 86,160 54,160 C 22,160 -2,112 4,62 C 10,12 20,12 58,6 Z');
}
.project-card[data-id="4"] {
  clip-path: path('M 50,4 C 78,-8 116,12 120,58 C 124,104 108,156 62,166 C 16,176 -8,136 0,82 C 8,28 22,16 50,4 Z');
}
.project-card[data-id="5"] {
  clip-path: path('M 66,6 C 98,-4 126,26 122,74 C 118,122 88,160 50,160 C 12,160 -8,108 0,58 C 8,8 34,16 66,6 Z');
}

.project-card:hover {
  filter: brightness(1.12)
          drop-shadow(0 0 10px rgba(255,218,58,1))
          drop-shadow(0 0 28px rgba(255,192,28,0.82))
          drop-shadow(0 0 60px rgba(255,158,0,0.46));
  transform: scale(1.1) translateY(-5px);
}

/* stem-glow paths toggled by JS */
.stem-glow {
  opacity: 0;
  transition: opacity 0.38s ease;
  pointer-events: none;
}

/* branch idle pulse */
.bgl {
  pointer-events: none;
  animation: branchPulse 4.2s ease-in-out infinite;
}
@keyframes branchPulse {
  0%, 100% { opacity: 0; }
  50%       { opacity: 0.13; }
}

/* ── Centered modal ────────────────────────── */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(255,252,244,0.60);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.32s ease;
}
#modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
#modal-card {
  background: rgba(252,250,243,0.94);
  border: 1px solid rgba(200,188,165,0.5);
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(40,30,10,0.18), 0 4px 16px rgba(40,30,10,0.10);
  width: min(500px, 88vw);
  max-height: 88vh;
  overflow-y: auto;
  padding: 42px 40px 46px;
  position: relative;
  transform: scale(0.86);
  transition: transform 0.38s cubic-bezier(0.34,1.4,0.64,1);
}
#modal-overlay.open #modal-card { transform: scale(1); }

.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: none; border: none;
  font-size: 18px; cursor: pointer; color: #b0a898;
  padding: 6px 10px; border-radius: 50%;
  transition: color 0.2s, background 0.2s; line-height: 1;
}
.modal-close:hover { color: #333; background: #ede8d8; }

#modal-cover-wrap {
  width: 100%; border-radius: 4px; overflow: hidden;
  margin-bottom: 26px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.12);
  aspect-ratio: 3/4;
}
#modal-cover-wrap svg { width: 100%; height: 100%; display: block; }

#modal-title {
  font-size: 24px; font-weight: normal; color: #181818;
  margin-bottom: 9px; letter-spacing: 0.2px; line-height: 1.3;
}
.modal-tag {
  display: inline-block; font-size: 10px;
  letter-spacing: 1.8px; text-transform: uppercase;
  padding: 4px 12px; border-radius: 20px; margin-bottom: 18px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#modal-desc { font-size: 14px; line-height: 1.9; color: #444; margin-bottom: 14px; }
#modal-body { font-size: 13px; line-height: 1.95; color: #888; font-style: italic; margin-bottom: 30px; }

.explore-btn {
  display: inline-block; padding: 11px 28px;
  border: 1.5px solid #3d5a3e; color: #3d5a3e;
  background: none; border-radius: 2px;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: 'Helvetica Neue', Arial, sans-serif;
  transition: background 0.2s, color 0.2s;
}
.explore-btn:hover { background: #3d5a3e; color: #f0eedf; }

/* ── Page chrome ───────────────────────────── */
#page-label {
  position: fixed; top: 28px; left: 36px;
  z-index: 100; pointer-events: none;
}
#page-label h1 {
  font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase;
  color: #9a8e7c; font-weight: normal;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#page-label p {
  font-size: 10px; color: #c0b8a8; letter-spacing: 0.8px; margin-top: 5px;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}
#hint {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2.5px; color: #c0b8a8; text-transform: uppercase;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
  animation: fadeOut 1.2s ease 4.5s forwards;
}
@keyframes fadeOut { to { opacity: 0; } }
#project-count {
  position: fixed; bottom: 28px; right: 36px;
  font-size: 10px; letter-spacing: 1.5px; color: #b8ae9c;
  font-family: 'Helvetica Neue', Arial, sans-serif; pointer-events: none;
}
</style>
</head>

    <stop offset="0%"   stop-color="#a89060" stop-opacity="0"/>
    <stop offset="55%"  stop-color="#907850" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#786040" stop-opacity="0.22"/>
  </linearGradient>
</defs>

function renderCards() {
  PROJECTS.forEach(p => {
    const el = document.querySelector(`.project-card[data-id="${p.id}"]`);
    if (el) el.innerHTML = p.makeCover(120, 160);
  });
}

function openDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modal-cover-wrap').innerHTML = p.makeCover(460, 614);
  document.getElementById('modal-title').textContent = p.title;
  const tag = document.getElementById('modal-tag');
  tag.textContent = p.tag;
  tag.style.background = p.tagBg;
  tag.style.color = p.tagFg;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-body').textContent = p.body;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('tree-svg').addEventListener('click', e => {
  const card = e.target.closest('.project-card');
  if (card) openDetail(Number(card.dataset.id));
});

document.querySelectorAll('.project-card').forEach(card => {
  const id = card.dataset.id;
  const stem = document.getElementById(`stem-${id}`);
  card.addEventListener('mouseenter', () => { if (stem) stem.style.opacity = '0.88'; });
  card.addEventListener('mouseleave', () => { if (stem) stem.style.opacity = '0'; });
});

document.getElementById('modal-close').addEventListener('click', closeDetail);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeDetail();
});

renderCards();
document.getElementById('project-count').textContent = `${PROJECTS.length} projects`;
</script>
